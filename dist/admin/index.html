<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin dashboard | Social Kartut</title><link rel="icon" href="/assets/social-kartut-logo-BC2HEWsi.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">  <script type="module" crossorigin src="/assets/supabase-DYAi91u0.js"></script>
  <script type="module" crossorigin src="/assets/admin-fhqkjNaj.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/admin-BYTihZfZ.css">
</head><body class="admin-body"><div class="admin-app"><aside class="admin-sidebar"><a href="../" class="admin-logo"><img src="/assets/social-kartut-logo-BC2HEWsi.png" alt="Social Kartut"></a><p class="sidebar-label">Workspace</p><nav><a class="sidebar-link active" href="#dashboard">Dashboard</a><a class="sidebar-link" href="#portfolio">Portfolio</a><a class="sidebar-link" href="#contact-settings">Contact settings</a></nav><button class="sidebar-link logout-button" id="logout-button" type="button">Logout <span>&nearr;</span></button></aside><main class="admin-main"><header class="admin-topbar"><div><p class="admin-kicker">Social Kartut admin</p><h1>Good to see you.</h1></div><a class="view-site" href="../" target="_blank" rel="noreferrer">View site <span>&nearr;</span></a></header><section id="dashboard" class="admin-section"><div class="section-heading-row"><div><p class="admin-kicker">Overview</p><h2>At a glance</h2></div></div><div class="stats-grid" id="stats-grid"><div class="stat-card"><span>Total projects</span><strong>--</strong></div><div class="stat-card"><span>Published</span><strong>--</strong></div><div class="stat-card"><span>Hidden</span><strong>--</strong></div><div class="stat-card"><span>Videos</span><strong>--</strong></div><div class="stat-card"><span>Images</span><strong>--</strong></div></div></section><section id="portfolio" class="admin-section"><div class="section-heading-row"><div><p class="admin-kicker">Selected work</p><h2>Portfolio</h2></div><button class="admin-button admin-button-primary" id="new-work-button" type="button">+ Add new work</button></div><p class="form-message" id="portfolio-message" role="status"></p><div class="portfolio-admin-list" id="portfolio-list"><div class="loading-state">Loading portfolio...</div></div></section><section id="contact-settings" class="admin-section"><div class="section-heading-row"><div><p class="admin-kicker">Public contact</p><h2>Contact settings</h2></div></div><form class="settings-form" id="settings-form"><label>Email<input type="email" name="email" placeholder="hello@yourdomain.com"></label><label>WhatsApp number<input type="text" name="whatsapp_number" placeholder="919876543210"></label><label>Instagram URL<input type="url" name="instagram_url" placeholder="https://instagram.com/yourhandle"></label><p class="form-message" id="settings-message" role="status"></p><button class="admin-button admin-button-primary" type="submit">Save contact settings</button></form></section></main></div><div class="admin-drawer" id="work-drawer" hidden><div class="drawer-backdrop" data-close-drawer></div><section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><button class="drawer-close" type="button" data-close-drawer aria-label="Close">&times;</button><p class="admin-kicker">Portfolio editor</p><h2 id="drawer-title">Add new work</h2><form id="work-form"><input type="hidden" name="id"><label>Title<input name="title" required maxlength="100"></label><label>Category<select name="category" required><option value="Promotional Video">Promotional Video</option><option value="Social Campaign">Social Campaign</option><option value="Reel Production">Reel Production</option><option value="Brand Design">Brand Design</option><option value="Social Creative">Social Creative</option><option value="Digital Campaign">Digital Campaign</option></select></label><label>Description<textarea name="description" rows="4" maxlength="240"></textarea></label><label>Media upload<input name="media" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime"><span class="file-hint">JPG, PNG, WEBP, MP4, WEBM or MOV. Maximum 100 MB.</span></label><div class="upload-preview" id="upload-preview"></div><label>Display order<input name="display_order" type="number" min="0" value="0" required></label><label class="switch-row"><input name="is_published" type="checkbox" checked><span>Publish this work</span></label><p class="form-message" id="work-message" role="alert"></p><button class="admin-button admin-button-primary" type="submit"><span>Save work</span><span class="button-spinner" aria-hidden="true"></span></button></form></section></div></body></html>
